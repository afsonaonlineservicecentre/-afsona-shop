<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFSONA Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#172033}
header{background:#075e54;color:white;padding:20px}
header h2{margin:0}
header p{margin:6px 0 0}
main{max-width:950px;margin:auto;padding:18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:white;padding:18px;border-radius:13px;box-shadow:0 2px 10px #0001}
.card h3{font-size:14px;color:#64748b;margin:0 0 12px}
.number{font-size:24px;font-weight:bold;color:#087f5b}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
.menu a{background:white;padding:17px;border-radius:12px;text-decoration:none;color:#075e54;font-weight:bold;border:1px solid #e2e8f0}
button{padding:12px 18px;border:0;border-radius:8px;background:#dc2626;color:white;font-weight:bold}
#message{margin:15px 0;color:#b91c1c}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}.menu{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<header>
<h2>AFSONA</h2>
<p>Shop Management Dashboard</p>
</header>

<main>
<h3>দোকানের হিসাব</h3>

<div class="grid">
<div class="card">
<h3>মোট পণ্য</h3>
<div class="number" id="products">0</div>
</div>
<div class="card">
<h3>মোট স্টক</h3>
<div class="number" id="stock">0</div>
</div>
<div class="card">
<h3>মোট বিক্রি</h3>
<div class="number" id="sales">₹0</div>
</div>
<div class="card">
<h3>মোট লাভ / ক্ষতি</h3>
<div class="number" id="profit">₹0</div>
</div>
<div class="card">
<h3>আজকের বিক্রি</h3>
<div class="number" id="todaySales">₹0</div>
</div>
<div class="card">
<h3>আজকের লাভ / ক্ষতি</h3>
<div class="number" id="todayProfit">₹0</div>
</div>
</div>

<h3 style="margin-top:28px">দোকানের কাজ</h3>

<div class="menu">
<a href="add-product.html">➕ পণ্য যোগ করুন</a>
<a href="products.html">📦 পণ্যের তালিকা</a>
<a href="sell.html">🛒 পণ্য বিক্রি</a>
<a href="history.html">📋 বিক্রির ইতিহাস</a>
<a href="reports.html">📊 রিপোর্ট</a>
<a href="expenses.html">💰 জমা ও খরচ</a>
</div>

<p id="message">হিসাব লোড হচ্ছে...</p>

<button id="logout">Logout</button>
</main>

<script>
const cfg = window.AFSONA_CONFIG || {};

if (
  !cfg.SUPABASE_URL ||
  !cfg.SUPABASE_URL.startsWith("https://") ||
  !cfg.SUPABASE_ANON_KEY ||
  !window.supabase
) {
  document.getElementById("message").textContent =
    "Supabase Config পরীক্ষা করুন।";
  throw new Error("Supabase config missing");
}

const db = window.supabase.createClient(
  cfg.SUPABASE_URL,
  cfg.SUPABASE_ANON_KEY
);

const money = n => "₹" + Number(n || 0).toFixed(2);

async function loadDashboard() {
  const message = document.getElementById("message");

  const {data:userData,error:userError} =
    await db.auth.getUser();

  if (userError || !userData.user) {
    window.location.href = "login.html";
    return;
  }

  const userId = userData.user.id;

  const {data:products,error:pError} = await db
    .from("shop_products")
    .select("id,stock")
    .eq("owner_id",userId);

  if (pError) throw pError;

  const {data:sales,error:sError} = await db
    .from("shop_sales")
    .select("total_amount,profit,created_at")
    .eq("owner_id",userId);

  if (sError) throw sError;

  const productCount = products.length;

  const totalStock = products.reduce(
    (sum,p) => sum + Number(p.stock || 0),0
  );

  const totalSales = sales.reduce(
    (sum,s) => sum + Number(s.total_amount || 0),0
  );

  const totalProfit = sales.reduce(
    (sum,s) => sum + Number(s.profit || 0),0
  );

  const today = new Date().toLocaleDateString("en-CA");

  const todayRecords = sales.filter(s =>
    new Date(s.created_at).toLocaleDateString("en-CA") === today
  );

  const todaySales = todayRecords.reduce(
    (sum,s) => sum + Number(s.total_amount || 0),0
  );

  const todayProfit = todayRecords.reduce(
    (sum,s) => sum + Number(s.profit || 0),0
  );

  document.getElementById("products").textContent = productCount;
  document.getElementById("stock").textContent = totalStock;
  document.getElementById("sales").textContent = money(totalSales);
  document.getElementById("profit").textContent = money(totalProfit);
  document.getElementById("todaySales").textContent = money(todaySales);
  document.getElementById("todayProfit").textContent = money(todayProfit);

  message.style.color = "green";
  message.textContent = "হিসাব সফলভাবে লোড হয়েছে।";
}

document.getElementById("logout").onclick = async () => {
  await db.auth.signOut();
  window.location.href = "login.html";
};

loadDashboard().catch(error => {
  document.getElementById("message").textContent =
    "সমস্যা: " + error.message;
});
</script>

</body>
</html>
