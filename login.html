<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFSONA Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#eef2f7;
  font-family:Arial,sans-serif;
  min-height:100vh;display:grid;
  place-items:center;padding:20px
}
.login{
  width:100%;max-width:400px;
  background:white;padding:25px;
  border-radius:16px;
  box-shadow:0 5px 25px #0001
}
h2{text-align:center;color:#08745c}
p{text-align:center;color:#64748b}
label{display:block;margin-top:18px;font-weight:bold}
input{
  width:100%;padding:14px;margin-top:7px;
  border:1px solid #cbd5e1;border-radius:9px;
  font-size:16px
}
button{
  width:100%;padding:14px;margin-top:22px;
  border:0;border-radius:9px;
  background:#08745c;color:white;
  font-size:17px;font-weight:bold
}
button:disabled{opacity:.6}
#message{text-align:center;margin-top:18px;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="login">
  <h2>AFSONA</h2>
  <p>Shop Management Login</p>

  <form id="loginForm">
    <label>Email Address</label>
    <input id="email" type="email"
      placeholder="আপনার ইমেইল" required>

    <label>Password</label>
    <input id="password" type="password"
      placeholder="আপনার পাসওয়ার্ড" required>

    <button id="loginBtn" type="submit">Login করুন</button>
  </form>

  <div id="message"></div>
</div>

<script>
const cfg = window.AFSONA_CONFIG || {};

if (
  !cfg.SUPABASE_URL ||
  !cfg.SUPABASE_URL.startsWith("https://") ||
  !cfg.SUPABASE_ANON_KEY ||
  !window.supabase
) {
  document.getElementById("message").textContent =
    "Supabase Config পরীক্ষা করুন।";
  throw new Error("Supabase configuration missing");
}

const db = window.supabase.createClient(
  cfg.SUPABASE_URL,
  cfg.SUPABASE_ANON_KEY
);

document.getElementById("loginForm")
.addEventListener("submit", async function(e) {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const btn = document.getElementById("loginBtn");
  const msg = document.getElementById("message");

  btn.disabled = true;
  btn.textContent = "Login হচ্ছে...";
  msg.textContent = "";

  try {
    const { data, error } = await db.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    if (!data.user) {
      throw new Error("Login সফল হয়নি।");
    }

    msg.style.color = "green";
    msg.textContent = "Login সফল! Dashboard খুলছে...";

    window.location.href = "dashboard.html";

  } catch(error) {
    msg.style.color = "red";
    msg.textContent = "Login সমস্যা: " + error.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "Login করুন";
  }
});
</script>
</body>
</html>
